[project]
name = "april"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.3",
]

[dependency-groups]
dev = [
    "djlint>=1.36.4",
    "ruff>=0.15.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "DJ"]

[tool.ruff.format]
indent-style = "space"
skip-magic-trailing-comma = false

[tool.djlint]
profile = "django"
ignore = "H030,H031"
